[package]
name = "json_http_client_desktop"
version = "0.0.1"
description = "JSON HTTP Client native Tauri host"
authors = ["JsonHTTClient contributors"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
